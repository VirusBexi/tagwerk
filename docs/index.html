const exportPayload = () => JSON.stringify({ app: 'tagwerk', exportedAt: new Date().toISOString(), state: S }, null, 1);

/** Merges a backup file into the current data. Throws on files from elsewhere. */
function importPayload(text) {
  const parsed = JSON.parse(text);
  const incoming = parsed.state || parsed;
  if (!COLS.some((c) => incoming[c])) throw new Error('Keine Tagwerk-Daten');
  const changed = mergeRemote(incoming);
  if (changed) onStoreChange();
  return changed;
}

/* ---------------------------------------------------- Calendar file (.ics)
   A web app can't wake itself up while it is closed. The phone's calendar can,
   so a reminder can be handed over to it, with an alarm attached. */
function icsFor(rem, today = todayStr()) {
  const occ = nextOf(rem, today);
  const stamp = new Date().toISOString().replace(/[-:]|\.\d{3}/g, '');
  const text = (s) => String(s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const day = occ.replace(/-/g, '');
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Tagwerk//DE',
    'BEGIN:VEVENT',
    `UID:${rem.id}@tagwerk`,
    `DTSTAMP:${stamp}`,
  ];
  if (rem.time) {
    lines.push(`DTSTART:${day}T${rem.time.replace(':', '')}00`, 'DURATION:PT1H');
  } else {
    lines.push(`DTSTART;VALUE=DATE:${day}`);
  }
  lines.push(`SUMMARY:${text(rem.title)}`);
  if (rem.kind === 'yearly') lines.push('RRULE:FREQ=YEARLY');
  const alarm = (trigger) => lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${text(rem.title)}`, `TRIGGER:${trigger}`, 'END:VALARM');
  alarm(rem.time ? '-PT30M' : 'PT9H');
  if (rem.lead) alarm(`-P${rem.lead}D`);
  lines.push('END:VEVENT', 'END:VCALENDAR');
  return lines.join('\r\n');
}

/* ===================================================================== SYNC
   Two ways to keep phone and PC on the same data, both built on mergeRemote():
   - Installed app: a private (secret) Gist on the user's own GitHub account.
   - Inside a Claude artifact: the artifact's own per-person database.
   Local storage always stays the source the app renders from, so everything
   keeps working offline and catches up later. */

const Sync = (() => {
  const API = 'https://api.github.com';
  const FILE = 'tagwerk.json';
  const DESC = 'Tagwerk Sync';
  const POLL_MS = 90 * 1000;

  let backend = null;
  let status = 'off'; // off | connecting | syncing | ok | offline | error
  let message = '';
  let lastAt = 0;
  let timer = 0;
  let pollTimer = 0;
  let busy = false;
  let again = false;
  let onRemoteChange = () => {};
  let onStatus = () => {};

  const setStatus = (s, msg = '') => {
    status = s;
    message = msg;
    onStatus();
  };

  /* ------------------------------------------------------------ GitHub */
  async function gh(path, token, opts = {}) {
    const res = await fetch(API + path, {
      method: opts.method || 'GET',
      cache: 'no-store',
      headers: {
        Accept: 'application/vnd.github+json',
        Authorization: `Bearer ${token}`,
        ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      },
      body: opts.body,
    });
    if (!res.ok) {
      const err = new Error(`GitHub ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  const gistBackend = (token, gistId) => ({
    kind: 'gist',
    async pull() {
      const gist = await gh(`/gists/${gistId}`, token);
      const file = gist.files && gist.files[FILE];
      if (!file) return null;
      const text = file.truncated ? await (await fetch(file.raw_url, { cache: 'no-store' })).text() : file.content;
      return JSON.parse(text);
    },
    push(state) {
      return gh(`/gists/${gistId}`, token, {
        method: 'PATCH',
        body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(state) } } }),
      });
    },
  });

  /** First device creates the secret Gist, every further device finds it again. */
  async function connectGist(token) {
    setStatus('connecting');
    try {
      const list = await gh('/gists?per_page=100', token);
      const found = list.find((g) => g.description === DESC && g.files && g.files[FILE]);
      let id = found && found.id;
      if (!id) {
        const created = await gh('/gists', token, {
          method: 'POST',
          body: JSON.stringify({ description: DESC, public: false, files: { [FILE]: { content: JSON.stringify(S) } } }),
        });
        id = created.id;
      }
      L.sync = { kind: 'gist', token, gistId: id };
      saveLocal();
      backend = gistBackend(token, id);
      startPolling();
      await run();
      return true;
    } catch (e) {
      setStatus('error', explain(e));
      return false;
    }
  }

  function disconnect() {
    L.sync = null;
    saveLocal();
    backend = null;
    clearInterval(pollTimer);
    setStatus('off');
  }

  function explain(e) {
    if (e.status === 401) return 'GitHub hat den Token nicht akzeptiert. Erstelle einen neuen mit dem Recht „gist“.';
    if (e.status === 403 || e.status === 429) return 'GitHub bremst gerade. In ein paar Minuten klappt es wieder.';
    if (e.status === 404) return 'Der Speicherort auf GitHub wurde nicht gefunden. Trenne die Verbindung und verbinde dich neu.';
    return 'Keine Verbindung. Deine Änderungen sind gespeichert und werden später übertragen.';
  }

  /* ----------------------------------------------------- Claude artifact */
  const artifactBackend = (coll) => {
    const written = {};
    return {
      kind: 'artifact',
      async pull() {
        const snap = await coll.get();
        return snap.empty ? null : assembleShards(snap.docs.map((d) => d.data()));
      },
      async push(state) {
        for (const [key, value] of Object.entries(shardState(state))) {
          const json = JSON.stringify(value);
          if (written[key] === json) continue;
          await coll.doc(key).set(value);
          written[key] = json;
        }
      },
    };
  };

  async function connectArtifact() {
    if (!window.claude || !window.claude.use) return;
    setStatus('connecting');
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const id = db && user ? await user.id() : null;
    if (!id) {
      setStatus('off', 'Nicht angemeldet: Deine Daten bleiben nur auf diesem Gerät.');
      return;
    }
    const coll = db.collection(`data/users/${id}`);
    backend = artifactBackend(coll);
    await run();
    // Changes from the other device arrive live.
    coll.onSnapshot(
      (snap) => {
        if (snap.metadata.hasPendingWrites || snap.metadata.fromCache || snap.empty) return;
        if (mergeRemote(assembleShards(snap.docs.map((d) => d.data())))) onRemoteChange();
      },
      () => setStatus('offline', 'Die Verbindung wurde getrennt. Lade die Seite neu, um wieder zu synchronisieren.'),
    );
  }

  /* ----------------------------------------------------------- Run loop */
  async function run() {
    if (!backend) return;
    if (busy) {
      again = true;
      return;
    }
    busy = true;
    setStatus('syncing');
    try {
      const remote = await backend.pull();
      const changed = remote ? mergeRemote(remote) : false;
      if (!remote || needsPush(remote)) await backend.push(S);
      lastAt = Date.now();
      setStatus('ok');
      if (changed) onRemoteChange();
    } catch (e) {
      setStatus(e.status === 401 ? 'error' : 'offline', e.status ? explain(e) : explain({}));
    }
    busy = false;
    if (again) {
      again = false;
      schedule(800);
    }
  }

  function schedule(delay = 1800) {
    if (!backend) return;
    clearTimeout(timer);
    timer = setTimeout(run, delay);
  }

  function startPolling() {
    clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (document.visibilityState === 'visible') run();
    }, POLL_MS);
  }

  function init(handlers) {
    onRemoteChange = handlers.onRemoteChange;
    onStatus = handlers.onStatus;
    onStoreChange = () => schedule();
    addEventListener('online', () => run());
    document.addEventListener('visibilitychange', () => {
      if (backend) run();
    });
    if (TARGET === 'artifact') {
      connectArtifact().catch(() => setStatus('off'));
    } else if (L.sync && L.sync.kind === 'gist') {
      backend = gistBackend(L.sync.token, L.sync.gistId);
      startPolling();
      run();
    }
  }

  return {
    init,
    run,
    connectGist,
    disconnect,
    get status() {
      return status;
    },
    get message() {
      return message;
    },
    get lastAt() {
      return lastAt;
    },
    get connected() {
      return !!backend;
    },
  };
})();

/* ==================================================================== SOUND
   Every sound is synthesized live with the Web Audio API, so the app ships no
   audio files and works offline. Check-offs climb a pentatonic scale over the
   course of a day: the more you finish, the higher it rings. */

const HOLD_MS = 950;

const Sound = (() => {
  const PACKS = {
    kristall: { label: 'Kristall', root: 76 },
    holz: { label: 'Holz', root: 67 },
    arcade: { label: 'Arcade', root: 72 },
  };
  const SCALE = [0, 2, 4, 7, 9];

  let ctx = null;
  let out = null;
  let verb = null;
  let noiseBuf = null;

  const m2f = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const gainFor = () => Math.pow(clamp(L.volume, 0, 1), 1.4);

  function ensure() {
    if (!L.sound) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        ctx = new AC({ latencyHint: 'interactive' });
      } catch {
        return null;
      }
      // A hard limiter only: quiet clicks pass untouched, big fanfares can't distort.
      const limiter = ctx.createDynamicsCompressor();
      limiter.knee.value = 0;
      limiter.threshold.value = -3;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.002;
      limiter.release.value = 0.12;
      out = ctx.createGain();
      out.gain.value = gainFor();
      out.connect(limiter);
      limiter.connect(ctx.destination);

      verb = ctx.createConvolver();
      verb.buffer = impulse(1.7, 2.8);
      const wet = ctx.createGain();
      wet.gain.value = 0.26;
      verb.connect(wet);
      wet.connect(out);

      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function impulse(seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const white = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        last = last * 0.55 + white * 0.45; // darker tail
        d[i] = last;
      }
    }
    return buf;
  }

  const wire = (node, send) => {
    node.connect(out);
    if (send) {
      const s = ctx.createGain();
      s.gain.value = send;
      node.connect(s);
      s.connect(verb);
    }
  };
  const envelope = (g, t, attack, decay, v) => {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + attack);
    g.gain.exponentialRampToValueAtTime(Math.max(v * 0.002, 0.0001), t + attack + decay);
  };

  function tone(type, f, t, dur, v, { to, send = 0.3, detune = 0, attack = 0.003 } = {}) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.detune.value = detune;
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.85);
    envelope(g, t, attack, dur, v);
    o.connect(g);
    wire(g, send);
    o.start(t);
    o.stop(t + attack + dur + 0.05);
  }

  /** FM bell: a sine whose pitch is wobbled by a second, inharmonic sine. */
  function bell(f, t, dur = 1.2, v = 0.2, ratio = 3.01, index = 2) {
    const c = ctx.createOscillator();
    const m = ctx.createOscillator();
    const mg = ctx.createGain();
    const g = ctx.createGain();
    c.frequency.value = f;
    m.frequency.value = f * ratio;
    mg.gain.setValueAtTime(f * index, t);
    mg.gain.exponentialRampToValueAtTime(Math.max(f * 0.02, 0.01), t + dur * 0.55);
    m.connect(mg);
    mg.connect(c.frequency);
    envelope(g, t, 0.002, dur, v);
    c.connect(g);
    wire(g, 0.55);
    c.start(t);
    m.start(t);
    c.stop(t + dur + 0.1);
    m.stop(t + dur + 0.1);
  }

  function marimba(f, t, v = 0.32) {
    tone('sine', f, t, 0.55, v, { send: 0.2 });
    tone('sine', f * 4, t, 0.1, v * 0.32, { send: 0.08 });
    tone('sine', f * 10, t, 0.025, v * 0.08, { send: 0 });
  }

  function chip(f, t, v = 0.11) {
    const o = ctx.createOscillator();
    const lp = ctx.createBiquadFilter();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(f, t);
    o.frequency.setValueAtTime(f * 1.5, t + 0.055);
    lp.type = 'lowpass';
    lp.frequency.value = 5200;
    envelope(g, t, 0.001, 0.17, v);
    o.connect(lp);
    lp.connect(g);
    wire(g, 0.08);
    o.start(t);
    o.stop(t + 0.22);
  }

  function noise(t, dur, v, { type = 'bandpass', f = 1800, q = 0.9, to } = {}) {
    const s = ctx.createBufferSource();
    const flt = ctx.createBiquadFilter();
    const g = ctx.createGain();
    s.buffer = noiseBuf;
    s.loop = true;
    flt.type = type;
    flt.Q.value = q;
    flt.frequency.setValueAtTime(f, t);
    if (to) flt.frequency.exponentialRampToValueAtTime(to, t + dur);
    envelope(g, t, Math.min(0.004, dur / 3), dur, v);
    s.connect(flt);
    flt.connect(g);
    wire(g, 0.12);
    s.start(t, Math.random() * 0.5);
    s.stop(t + dur + 0.05);
  }

  const thump = (t, v = 0.3, f = 170, to = 70, dur = 0.09) => tone('sine', f, t, dur, v, { to, send: 0 });

  /** Warm chord: two detuned saws per note through a filter that opens up. */
  function pad(midis, t, dur, v = 0.05) {
    const flt = ctx.createBiquadFilter();
    const g = ctx.createGain();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(700, t);
    flt.frequency.exponentialRampToValueAtTime(3400, t + dur * 0.5);
    flt.frequency.exponentialRampToValueAtTime(900, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1, t + 0.05);
    g.gain.setValueAtTime(1, t + dur * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    flt.connect(g);
    wire(g, 0.6);
    for (const m of midis) {
      for (const det of [-7, 7]) {
        const o = ctx.createOscillator();
        const a = ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.value = m2f(m);
        o.detune.value = det;
        a.gain.value = v;
        o.connect(a);
        a.connect(flt);
        o.start(t);
        o.stop(t + dur + 0.05);
      }
    }
  }

  /** One note in the timbre of the chosen sound pack. */
  function note(m, t, v = 0.28) {
    if (L.pack === 'holz') marimba(m2f(m), t, v * 1.25);
    else if (L.pack === 'arcade') chip(m2f(m), t, v * 0.9);
    else bell(m2f(m), t, 0.95, v * 1.05);
  }

  const FX = {
    check(t, { step = 0 } = {}) {
      const root = PACKS[L.pack].root;
      const oct = Math.min(Math.floor(step / SCALE.length), 2);
      const m = root + 12 * oct + SCALE[step % SCALE.length] - 12;
      thump(t, 0.34, 200, 85, 0.07);
      noise(t, 0.022, 0.16, { f: 3000 });
      note(m, t + 0.004, 0.62);
      note(m + 12, t + 0.05, 0.2);
      if (step >= 3) note(m + 7, t + 0.07, 0.26);
    },
    uncheck(t) {
      const root = PACKS[L.pack].root - 12;
      thump(t, 0.2, 150, 80, 0.07);
      note(root, t, 0.24);
      tone('sine', m2f(root), t + 0.01, 0.13, 0.16, { to: m2f(root - 7), send: 0.1 });
    },
    tick(t, { i = 0 } = {}) {
      tone('sine', 880 + i * 130, t, 0.04, 0.1, { send: 0.04 });
    },
    tap(t) {
      tone('sine', 1500, t, 0.02, 0.09, { send: 0 });
    },
    tab(t) {
      tone('triangle', 620, t, 0.06, 0.2, { to: 840, send: 0.08 });
    },
    select(t, { i = 0 } = {}) {
      tone('triangle', m2f(72 + SCALE[i % 5] + (i >= 5 ? 12 : 0)), t, 0.09, 0.2, { send: 0.12 });
    },
    open(t) {
      noise(t, 0.2, 0.2, { f: 700, to: 2600, q: 0.7 });
    },
    close(t) {
      noise(t, 0.16, 0.16, { f: 2200, to: 600, q: 0.7 });
    },
    add(t) {
      tone('sine', 380, t, 0.1, 0.42, { to: 820, send: 0.2 });
      note(PACKS[L.pack].root, t + 0.075, 0.42);
    },
    remove(t) {
      noise(t, 0.2, 0.34, { f: 1600, to: 260 });
      thump(t + 0.05, 0.42, 130, 50, 0.13);
    },
    move(t) {
      noise(t, 0.2, 0.2, { f: 900, to: 3000 });
      tone('sine', 520, t + 0.02, 0.1, 0.26, { to: 780, send: 0.2 });
    },
    undo(t) {
      tone('sine', 780, t, 0.1, 0.32, { to: 420, send: 0.2 });
    },
    ding(t) {
      bell(m2f(88), t, 0.9, 0.3, 2.01, 1.2);
      bell(m2f(95), t + 0.09, 1.1, 0.22, 2.01, 1);
    },
    step(t, { i = 0 } = {}) {
      note(PACKS[L.pack].root - 5 + SCALE[i % 5], t, 0.4);
    },
    deny(t) {
      tone('triangle', 200, t, 0.08, 0.34, { send: 0.05 });
      tone('triangle', 165, t + 0.09, 0.11, 0.34, { send: 0.05 });
    },
    goal(t) {
      const r = PACKS[L.pack].root - 12;
      thump(t, 0.75, 120, 36, 0.5);
      noise(t, 0.5, 0.42, { type: 'lowpass', f: 900, to: 180, q: 0.4 });
      [0, 7, 12, 16, 19, 24].forEach((s, i) => note(r + s, t + 0.02 + i * 0.045, 0.34));
      pad([r - 12, r, r + 4, r + 7, r + 11], t + 0.02, 1.8, 0.05);
      bell(m2f(r + 36), t + 0.3, 1.8, 0.18);
    },
    levelup(t) {
      const r = PACKS[L.pack].root - 12;
      noise(t, 0.6, 0.2, { f: 400, to: 5200, q: 0.8 });
      const start = t + 0.3;
      [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => note(r + s, start + i * 0.062, 0.36));
      const hit = start + 0.46;
      thump(hit, 0.7, 110, 40, 0.42);
      pad([r - 12, r, r + 4, r + 7, r + 11, r + 14], hit, 2.5, 0.06);
      [24, 28, 31, 36].forEach((s, i) => bell(m2f(r + s), hit + i * 0.09, 1.9, 0.18));
    },
    alldone(t) {
      const r = PACKS[L.pack].root - 12;
      pad([r - 7, r - 3, r + 2, r + 9], t, 0.6, 0.05); // Fsus-Klang
      pad([r - 5, r - 1, r + 2, r + 7], t + 0.36, 0.6, 0.05); // Dominante
      pad([r - 12, r, r + 4, r + 7, r + 11, r + 14], t + 0.72, 2.9, 0.06); // Auflösung
      [7, 9, 12, 16, 19, 24].forEach((s, i) => note(r + s, t + 0.1 + i * 0.13, 0.32));
      [24, 31, 36].forEach((s, i) => bell(m2f(r + s), t + 0.86 + i * 0.13, 2, 0.18));
      thump(t + 0.72, 0.55, 100, 40, 0.5);
    },
  };

  function play(name, opts) {
    if (!ensure()) return;
    try {
      out.gain.value = gainFor();
      FX[name](ctx.currentTime + 0.002, opts);
    } catch {
      /* Sound must never break an action. */
    }
  }

  /** Rising charge sound while a goal button is held. Returns stop(). */
  function holdStart() {
    if (!ensure()) return () => {};
    const t = ctx.currentTime + 0.005;
    const span = HOLD_MS / 1000;
    const o = ctx.createOscillator();
    const f = ctx.createBiquadFilter();
    const g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(70, t);
    o.frequency.exponentialRampToValueAtTime(560, t + span);
    f.type = 'lowpass';
    f.Q.value = 7;
    f.frequency.setValueAtTime(240, t);
    f.frequency.exponentialRampToValueAtTime(4200, t + span);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + span * 0.8);
    o.connect(f);
    f.connect(g);
    wire(g, 0.25);
    o.start(t);
    return () => {
      const now = ctx.currentTime;
      g.gain.cancelScheduledValues(now);
      g.gain.setTargetAtTime(0.0001, now, 0.035);
      o.frequency.cancelScheduledValues(now);
      o.frequency.setTargetAtTime(55, now, 0.06);
      o.stop(now + 0.25);
    };
  }

  /** Browsers only start audio from a user gesture. */
  const unlock = () => ensure();

  return { play, holdStart, unlock, PACKS };
})();

/* ================================================================== HAPTICS
   Android vibrates directly. Safari has no vibration API, but from iOS 18 on,
   toggling a native switch element gives a tiny haptic tap. */
const Haptic = (() => {
  const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const PATTERNS = {
    tick: 6,
    tap: 9,
    swipe: 12,
    success: [12, 40, 22],
    heavy: [24, 40, 40],
    level: [22, 60, 22, 60, 70],
    deny: [30, 50, 30],
  };
  let sw = null;
  const iosTap = () => {
    if (!sw) {
      sw = document.createElement('label');
      sw.setAttribute('aria-hidden', 'true');
      sw.style.cssText = 'position:fixed;left:-99px;top:0;opacity:0;pointer-events:none';
      sw.innerHTML = '<input type="checkbox" switch tabindex="-1">';
      document.body.append(sw);
    }
    sw.click();
  };
  return (kind) => {
    if (!L.haptics) return;
    const p = PATTERNS[kind] || 8;
    if (navigator.vibrate) {
      try {
        navigator.vibrate(p);
      } catch {
        /* optional */
      }
    } else if (IOS) {
      const taps = Array.isArray(p) ? Math.ceil(p.length / 2) : 1;
      for (let i = 0; i < taps; i++) setTimeout(iosTap, i * 90);
    }
  };
})();

/* ==================================================================== SCENE
   The signature of the app: a poster landscape whose sky shows how far today
   has come. Nothing done: night, stars, a thin moon. Every finished task lifts
   the sun and pushes the sky through plum and coral to full gold.
   Stars and clouds are separate layers, so only the compositor animates them. */

const Scene = (() => {
  const STOPS = [
    { p: 0, bands: ['#0B0E27', '#0E112E', '#111535', '#14183C', '#171C44', '#1B204C', '#1F2455', '#23285E'], sun: '#2B2F6C', far: '#161A4A', mid: '#10133A', near: '#0B0D24' },
    { p: 0.25, bands: ['#12133A', '#191749', '#231C59', '#2F2168', '#3E2775', '#522E7F', '#6A3585', '#853C86'], sun: '#FF8A5F', far: '#2C1F60', mid: '#1A174A', near: '#0C0E28' },
    { p: 0.5, bands: ['#2A1B5E', '#43236F', '#60297B', '#802F7F', '#A0387C', '#C04674', '#DC5868', '#F0705B'], sun: '#FFC76E', far: '#5B2771', mid: '#301C56', near: '#100F2C' },
    { p: 0.75, bands: ['#6B2A7A', '#93347C', '#B84076', '#D6506A', '#EA655B', '#F5804E', '#FA9C47', '#FDB94A'], sun: '#FFE28C', far: '#A33C6E', mid: '#5C2361', near: '#15102E' },
    { p: 1, bands: ['#E8503F', '#F0663B', '#F67E38', '#FA9537', '#FDAD3A', '#FEC447', '#FFD762', '#FFE685'], sun: '#FFF7CC', far: '#C8463F', mid: '#7A2A56', near: '#1A1130' },
  ];
  const BAND_SIZES = [11, 8.2, 6.1, 4.5, 3.3, 2.4, 1.65];
  const SLIM_DROP = 90; // how much shorter the sky is outside the "Heute" tab on phones

  let root, wrap, skyEl, starsEl, cloudsEl, hillsEl;
  let W = 0;
  let H = 0;
  let R = 40;
  let cx = 0;
  let horizon = 0;
  let desktop = false;
  let slim = false;
  let progress = 0;
  let sunY = 0;
  let halo, sunEl, bandEls, farEl, midEl, nearEl, treesEl;
  let finaleTimer = 0;

  /* ------------------------------------------------------------- Colors */
  const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => {
    const x = hex2rgb(a);
    const y = hex2rgb(b);
    return `#${[0, 1, 2].map((i) => Math.round(lerp(x[i], y[i], t)).toString(16).padStart(2, '0')).join('')}`;
  };
  function colorsAt(p) {
    let i = 0;
    while (i < STOPS.length - 2 && p > STOPS[i + 1].p) i++;
    const a = STOPS[i];
    const b = STOPS[i + 1];
    const t = clamp((p - a.p) / (b.p - a.p), 0, 1);
    return {
      bands: a.bands.map((c, n) => mix(c, b.bands[n], t)),
      sun: mix(a.sun, b.sun, t),
      far: mix(a.far, b.far, t),
      mid: mix(a.mid, b.mid, t),
      near: mix(a.near, b.near, t),
    };
  }

  /* ----------------------------------------------------------- Geometry */
  function seeded(seed) {
    let s = seed;
    return () => {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }
  function hillY(x, base, amp, seed) {
    const u = x / Math.max(W, 1);
    return (
      base -
      amp * (0.55 * Math.sin(u * Math.PI * 1.5 + seed) + 0.3 * Math.sin(u * Math.PI * 3.3 + seed * 2.3) + 0.15 * Math.sin(u * Math.PI * 7.1 + seed * 0.7))
    );
  }
  function hillPath(base, amp, seed) {
    let d = `M-2 ${H + 20} L-2 ${hillY(0, base, amp, seed).toFixed(1)}`;
    for (let x = 8; x <= W + 8; x += 8) d += ` L${x} ${hillY(x, base, amp, seed).toFixed(1)}`;
    return `${d} L${W + 8} ${H + 20} Z`;
  }
  function treesPath(base, amp, seed, scale) {
    const rnd = seeded(Math.floor(seed * 1000) + 11);
    let d = '';
    let x = 6 + rnd() * 24;
    while (x < W) {
      const y = hillY(x, base, amp, seed) + 3;
      const h = (13 + rnd() * 15) * scale;
      const w = h * (0.28 + rnd() * 0.08);
      d += `M${x.toFixed(1)} ${(y - h).toFixed(1)} L${(x - w).toFixed(1)} ${y.toFixed(1)} L${(x + w).toFixed(1)} ${y.toFixed(1)} Z `;
      d += `M${x.toFixed(1)} ${(y - h * 1.3).toFixed(1)} L${(x - w * 0.7).toFixed(1)} ${(y - h * 0.55).toFixed(1)} L${(x + w * 0.7).toFixed(1)} ${(y - h * 0.55).toFixed(1)} Z `;
      x += rnd() < 0.3 ? (5 + rnd() * 9) * scale : (20 + rnd() * 62) * scale;
    }
    return d;
  }

  function build() {
    const box = wrap.getBoundingClientRect();
    const w = Math.round(box.width);
    const h = Math.round(box.height);
    if (w < 10 || h < 10) return;
    W = w;
    H = h;
    desktop = matchMedia('(min-width: 960px)').matches;
    const scale = desktop ? 1.7 : 1;
    const footH = desktop ? Math.max(170, H * 0.24) : 58;
    R = clamp(Math.min(W, H) * (desktop ? 0.14 : 0.1), 26, 92);
    cx = W * (desktop ? 0.66 : 0.77);
    const nearBase = H - footH;
    const midBase = nearBase - (desktop ? 46 : 18);
    const farBase = midBase - (desktop ? 62 : 22);
    horizon = farBase;
    const vb = `0 0 ${W} ${H}`;

    // The box was rounded to whole pixels: stretch by that fraction instead of leaving a seam.
    [skyEl, cloudsEl, hillsEl].forEach((svg) => svg.setAttribute('preserveAspectRatio', 'none'));
    skyEl.setAttribute('viewBox', vb);
    const rays = Array.from({ length: 16 }, (_, i) => {
      const a = (i / 16) * Math.PI * 2;
      const spread = 0.085;
      const far = Math.max(W, H) * 1.3;
      const p = (ang) => `${(Math.cos(ang) * far).toFixed(0)} ${(Math.sin(ang) * far).toFixed(0)}`;
      return `M0 0 L${p(a - spread)} L${p(a + spread)} Z`;
    }).join(' ');
    skyEl.innerHTML =
      `<rect class="band" width="${W}" height="${H}"/>` +
      `<g class="halo">` +
      BAND_SIZES.map((m) => `<circle class="band" r="${(R * m).toFixed(1)}"/>`).join('') +
      `<path class="rays" d="${rays}"/>` +
      `<circle class="sun" r="${R.toFixed(1)}"/></g>`;

    const rnd = seeded(4242);
    const starDots = (n, spread) => {
      let s = '';
      for (let i = 0; i < n; i++) {
        const x = rnd() * W;
        const y = rnd() * horizon * spread;
        const r = (0.5 + rnd() * rnd() * 1.3) * (desktop ? 1.25 : 1);
        s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}"/>`;
      }
      return s;
    };
    const moonR = desktop ? 30 : 15;
    const mx = W * (desktop ? 0.72 : 0.81);
    const my = horizon * (desktop ? 0.3 : 0.55);
    starsEl.innerHTML =
      `<svg class="layer tw-a" viewBox="${vb}" aria-hidden="true"><g fill="#FFF4E0">${starDots(desktop ? 60 : 30, 0.96)}</g></svg>` +
      `<svg class="layer tw-b" viewBox="${vb}" aria-hidden="true"><g fill="#FFF4E0">${starDots(desktop ? 50 : 24, 0.96)}</g>` +
      `<path class="moon" fill="#F8EFD7" d="M${mx} ${my - moonR} A${moonR} ${moonR} 0 1 0 ${mx} ${my + moonR} A${moonR * 1.32} ${moonR * 1.32} 0 0 1 ${mx} ${my - moonR} Z"/></svg>`;

    const cloud = (x, y, s) =>
      [
        [0, 0, 92, 15],
        [16, -11, 52, 14],
        [-22, 11, 80, 12],
      ]
        .map(([dx, dy, cw, ch]) => `<rect x="${x + dx * s}" y="${y + dy * s}" width="${cw * s}" height="${ch * s}" rx="${(ch * s) / 2}"/>`)
        .join('');
    cloudsEl.setAttribute('viewBox', vb);
    cloudsEl.innerHTML = desktop
      ? cloud(W * 0.12, H * 0.42, 1.7) + cloud(W * 0.62, H * 0.5, 1.2) + cloud(W * 0.3, H * 0.6, 0.9)
      : cloud(W * 0.1, horizon * 0.7, 0.72) + cloud(W * 0.55, horizon * 0.52, 0.55);

    hillsEl.setAttribute('viewBox', vb);
    const amp = desktop ? 26 : 10;
    const seedFar = 0.8;
    const seedMid = 2.6;
    const seedNear = 4.4;
    hillsEl.innerHTML =
      `<path class="far" d="${hillPath(farBase, amp * 1.25, seedFar)}"/>` +
      `<path class="tree-far" d="${treesPath(midBase, amp, seedMid, scale * 0.82)}"/>` +
      `<path class="mid" d="${hillPath(midBase, amp, seedMid)}"/>` +
      `<path class="near" d="${hillPath(nearBase, amp * 0.5, seedNear)}"/>`;

    halo = $('.halo', skyEl);
    sunEl = $('.sun', skyEl);
    bandEls = $$('.band', skyEl);
    farEl = $('.far', hillsEl);
    midEl = $('.mid', hillsEl);
    nearEl = $('.near', hillsEl);
    treesEl = $('.tree-far', hillsEl);
    root.classList.add('no-tr');
    apply();
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('no-tr')));
  }

  function apply() {
    if (!W || !halo) return;
    const p = progress;
    const c = colorsAt(p);
    bandEls.forEach((el, i) => {
      el.style.fill = c.bands[i];
    });
    sunEl.style.fill = c.sun;
    farEl.style.fill = c.far;
    midEl.style.fill = c.mid;
    treesEl.style.fill = c.mid;
    nearEl.style.fill = c.near;

    const visible = desktop || !slim ? H : H - SLIM_DROP;
    const top = H - visible;
    const lifted = p <= 0 ? 0 : 0.16 + 0.84 * p;
    const eased = Math.sin((lifted * Math.PI) / 2);
    const low = horizon + R * 1.55;
    const high = top + visible * (desktop ? 0.25 : 0.27);
    sunY = lerp(low, high, eased);
    halo.style.transform = `translate(${cx}px, ${sunY}px)`;

    starsEl.style.opacity = clamp(1 - p * 3.6, 0, 1);
    cloudsEl.style.opacity = clamp((p - 0.18) * 1.5, 0, 0.92);
    cloudsEl.style.fill = mix(c.bands[3], '#FFF4E0', 0.28);

    const rootStyle = document.documentElement.style;
    rootStyle.setProperty('--ground', c.near);
    rootStyle.setProperty('--hero-fg', p >= 0.82 ? '#2A0F2E' : '#FFF4E0');
    rootStyle.setProperty('--hero-shadow', p >= 0.82 ? 'rgba(255, 240, 200, 0.28)' : 'rgba(30, 10, 50, 0.38)');
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', c.bands[0]);
  }

  /* ---------------------------------------------------------------- API */
  function mount(el) {
    root = el;
    wrap = $('.sky-wrap', el);
    skyEl = $('.sky', el);
    starsEl = $('.stars', el);
    cloudsEl = $('.clouds', el);
    hillsEl = $('.hills', el);
    build();
    let lastW = 0;
    let lastH = 0;
    new ResizeObserver(() => {
      const b = wrap.getBoundingClientRect();
      if (Math.abs(b.width - lastW) > 1 || Math.abs(b.height - lastH) > 1) {
        lastW = b.width;
        lastH = b.height;
        build();
      }
    }).observe(wrap);
  }

  function set(p, isSlim) {
    const changed = p !== progress || isSlim !== slim;
    progress = clamp(p, 0, 1);
    slim = isSlim;
    if (changed) apply();
  }

  function pulse() {
    if (!sunEl || !motionOK()) return;
    sunEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.22)' }, { transform: 'scale(1)' }], {
      duration: 520,
      easing: 'cubic-bezier(.2,1.4,.4,1)',
    });
  }

  /** Where flying XP should land: the sun if it is on screen. */
  function sunPoint() {
    if (!wrap) return null;
    const b = wrap.getBoundingClientRect();
    const y = b.top + Math.min(sunY, horizon);
    const min = root.getBoundingClientRect().top + 8;
    if (y < Math.max(min, 8)) return null;
    return { x: b.left + cx, y };
  }

  function finale() {
    if (!root) return;
    clearTimeout(finaleTimer);
    root.classList.add('finale');
    if (motionOK()) {
      const birds = document.createElement('div');
      birds.className = 'birds';
      birds.innerHTML =
        '<svg viewBox="0 0 90 30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">' +
        '<path d="M2 12 q6 -7 11 0 q5 -7 11 0"/><path d="M34 22 q5 -6 9 0 q4 -6 9 0"/><path d="M62 8 q5 -6 9 0 q4 -6 9 0"/></g></svg>';
      root.append(birds);
      setTimeout(() => birds.remove(), 6200);
    }
    finaleTimer = setTimeout(() => root.classList.remove('finale'), 4200);
  }

  return { mount, set, pulse, sunPoint, finale, SLIM_DROP };
})();

function motionOK() {
  return L.motion && !matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* ======================================================================= FX
   Particles on one full-screen canvas. The loop only runs while something is
   alive, so an idle app costs no battery. */

const Fx = (() => {
  let cv, ctx, W, H, dpr;
  let parts = [];
  let rings = [];
  let running = false;
  let last = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    cv.width = W * dpr;
    cv.height = H * dpr;
  }
  function init() {
    cv = $('#fx');
    ctx = cv.getContext('2d');
    resize();
    addEventListener('resize', resize);
  }

  function start() {
    if (running) return;
    running = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    rings = rings.filter((r) => (r.age += dt) < r.life);
    for (const r of rings) {
      const t = r.age / r.life;
      const e = 1 - Math.pow(1 - t, 3);
      ctx.globalAlpha = (1 - t) * 0.8;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.width * (1 - t) + 0.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, Math.PI * 2);
      ctx.stroke();
    }

    parts = parts.filter((p) => (p.age += dt) < p.life);
    for (const p of parts) {
      p.vy += p.g * dt;
      p.vx *= 1 - p.drag * dt;
      p.vy *= 1 - p.drag * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
      const t = p.age / p.life;
      ctx.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : 1;
      ctx.fillStyle = p.color;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.flutter) ctx.scale(Math.cos(p.age * p.flutter), 1);
      if (p.shape === 'tri') {
        ctx.beginPath();
        ctx.moveTo(0, -p.s);
        ctx.lineTo(p.s * 0.85, p.s * 0.7);
        ctx.lineTo(-p.s * 0.85, p.s * 0.7);
        ctx.closePath();
        ctx.fill();
      } else if (p.shape === 'dot') {
        ctx.beginPath();
        ctx.arc(0, 0, p.s * 0.65, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.s, -p.s * 0.45, p.s * 2, p.s * 0.9);
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (parts.length || rings.length) {
      requestAnimationFrame(loop);
    } else {
      running = false;
      ctx.clearRect(0, 0, W, H);
    }
  }

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const SHAPES = ['tri', 'rect', 'dot'];

  /** Shards flying out from a check mark, plus a shock ring. */
  function burst(x, y, color, count = 16, power = 1) {
    if (!motionOK()) return;
    const colors = [color, color, '#FFF4E0', '#FFC145'];
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + Math.random() * 0.5;
      const v = (120 + Math.random() * 300) * power;
      parts.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 60 * power,
        g: 620,
        drag: 2.8,
        s: 2.2 + Math.random() * 3.6 * power,
        rot: Math.random() * 6,
        spin: (Math.random() - 0.5) * 16,
        shape: pick(SHAPES),
        color: pick(colors),
        age: 0,
        life: 0.5 + Math.random() * 0.45,
      });
    }
    rings.push({ x, y, r0: 12, r1: 56 * power, width: 5 * power, color, age: 0, life: 0.46 });
    start();
  }

  /** Paper falling from the top of the screen. */
  function confetti(count = 110, colors = ['#FFC145', '#FF7A59', '#FFF4E0', '#FF6F91', '#F67E38', '#FFE685']) {
    if (!motionOK()) return;
    for (let i = 0; i < count; i++) {
      parts.push({
        x: Math.random() * W,
        y: -20 - Math.random() * H * 0.6,
        vx: (Math.random() - 0.5) * 70,
        vy: 130 + Math.random() * 220,
        g: 60,
        drag: 0.25,
        s: 3 + Math.random() * 4.5,
        rot: Math.random() * 6,
        spin: (Math.random() - 0.5) * 7,
        flutter: 4 + Math.random() * 6,
        shape: Math.random() < 0.8 ? 'rect' : 'tri',
        color: pick(colors),
        age: 0,
        life: 2.4 + Math.random() * 1.8,
      });
    }
    start();
  }

  function ring(x, y, color, r1 = 90) {
    if (!motionOK()) return;
    rings.push({ x, y, r0: 10, r1, width: 7, color, age: 0, life: 0.62 });
    start();
  }

  /** Sends "+25" across the screen. `done` runs when it lands, also without animation. */
  function flyXp(from, to, text, color, done) {
    if (!motionOK() || !to) {
      if (done) done();
      return;
    }
    const orb = document.createElement('div');
    orb.className = 'orb';
    orb.textContent = text;
    orb.style.setProperty('--c', color);
    orb.style.left = `${from.x}px`;
    orb.style.top = `${from.y}px`;
    document.body.append(orb);
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const midX = dx * 0.42 + (dx >= 0 ? 40 : -40);
    const midY = dy * 0.5 - 30;
    const anim = orb.animate(
      [
        { transform: 'translate(-50%,-50%) scale(.5)', opacity: 0 },
        { transform: 'translate(-50%,-50%) translate(0,-26px) scale(1.18)', opacity: 1, offset: 0.2 },
        { transform: `translate(-50%,-50%) translate(${midX}px,${midY}px) scale(1)`, opacity: 1, offset: 0.62 },
        { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.45)`, opacity: 0.85 },
      ],
      { duration: 680, easing: 'cubic-bezier(.45,0,.3,1)', fill: 'forwards' },
    );
    anim.onfinish = () => {
      orb.remove();
      if (done) done();
    };
  }

  return { init, burst, confetti, ring, flyXp };
})();

/* ====================================================== XP-Anzeige (HUD)
   A pill that slides in after every gain and fills the category's level bar
   right in front of you. Rapid gains reuse the same pill. */
const Hud = (() => {
  let hideTimer = 0;
  let root;

  function show({ emoji, name, color, xp, before, after }) {
    root = root || $('#hud');
    const leveled = after.level > before.level;
    root.innerHTML = `
      <div class="hud-card" style="--c:${esc(color)}">
        <span class="hud-emoji">${esc(emoji)}</span>
        <div class="hud-body">
          <div class="hud-top"><b>${esc(name)}</b><span>Level <b class="hud-lv">${before.level}</b></span></div>
          <div class="hud-bar" role="presentation"><i style="width:${(before.pct * 100).toFixed(1)}%"></i></div>
        </div>
        <span class="hud-xp">+${xp}</span>
      </div>`;
    root.classList.add('on');
    const bar = $('.hud-bar i', root);
    const lv = $('.hud-lv', root);
    const ticks = 7;
    requestAnimationFrame(() =>
      requestAnimationFrame(() => {
        bar.style.width = leveled ? '100%' : `${(after.pct * 100).toFixed(1)}%`;
      }),
    );
    for (let i = 0; i < ticks; i++) setTimeout(() => Sound.play('tick', { i }), 260 + i * 62);
    if (leveled) {
      setTimeout(() => {
        lv.textContent = after.level;
        lv.classList.add('bump');
        bar.style.transition = 'none';
        bar.style.width = '0%';
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            bar.style.transition = '';
            bar.style.width = `${(after.pct * 100).toFixed(1)}%`;
          }),
        );
      }, 760);
    }
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => root.classList.remove('on'), leveled ? 1400 : 2100);
  }
  return { show };
})();

/* ================================================================ Level-up */
const LevelUp = (() => {
  const queue = [];
  let open = false;
  let afterQueue = null;

  function next() {
    const item = queue.shift();
    const host = $('#levelRoot');
    if (!item) {
      open = false;
      host.innerHTML = '';
      if (afterQueue) {
        const fn = afterQueue;
        afterQueue = null;
        setTimeout(fn, 260);
      }
      return;
    }
    open = true;
    const { name, emoji, color, from, to, rankBefore, rank } = item;
    host.innerHTML = `
      <div class="lvl" style="--c:${esc(color)}" data-act="close-level" role="dialog" aria-label="Level ${to} erreicht">
        <div class="lvl-bands" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="lvl-body">
          <div class="lvl-emoji">${esc(emoji)}</div>
          <p class="lvl-name">${esc(name)}</p>
          <div class="lvl-num" aria-hidden="true"><span class="old">${from}</span><span class="new">${to}</span></div>
          <p class="lvl-title">Level ${to}!</p>
          <p class="lvl-rank">${rank !== rankBefore ? `Neuer Rang: ${esc(rank)}` : esc(rank)}</p>
        </div>
        <button class="btn lvl-btn" data-act="close-level">Weiter</button>
      </div>`;
    Sound.play('levelup');
    Haptic('level');
    setTimeout(() => {
      const r = $('.lvl-num');
      if (r) {
        const b = r.getBoundingClientRect();
        Fx.burst(b.left + b.width / 2, b.top + b.height / 2, color, 34, 2.2);
      }
      Fx.confetti(90, [color, color, '#FFF4E0', '#FFC145']);
    }, 720);
  }

  const close = () => next();

  function push(item) {
    queue.push(item);
    if (!open) next();
  }

  /** Runs fn once all level-up screens are gone (they start after `delay`). */
  function afterAll(fn, delay = 0) {
    setTimeout(() => {
      if (open || queue.length) afterQueue = fn;
      else fn();
    }, delay + 20);
  }

  return { push, close, afterAll, get open() { return open; } };
})();

/* Number roll-up for counters in the sky. */
function rollNumber(el, to, ms = 500) {
  const from = Number(el.dataset.val ?? el.textContent) || 0;
  el.dataset.val = to;
  if (from === to || !motionOK()) {
    el.textContent = to;
    return;
  }
  const t0 = performance.now();
  const step = (now) => {
    const t = clamp((now - t0) / ms, 0, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(lerp(from, to, eased));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ==================================================================== MORPH
   Views are plain HTML strings. Instead of replacing the DOM, this patches it,
   so existing elements survive a render and CSS transitions keep playing.
   Children with data-k keep their identity even when they move. */

const keyOf = (n) => (n.nodeType === 1 ? n.getAttribute('data-k') : null);

function morphAttrs(a, b) {
  for (let i = b.attributes.length - 1; i >= 0; i--) {
    const { name, value } = b.attributes[i];
    if (a.getAttribute(name) !== value) a.setAttribute(name, value);
  }
  for (let i = a.attributes.length - 1; i >= 0; i--) {
    const { name } = a.attributes[i];
    if (!b.hasAttribute(name)) a.removeAttribute(name);
  }
}

function morphNode(a, b) {
  if (a.nodeType !== 1) {
    if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
    return;
  }
  morphAttrs(a, b);
  const tag = a.nodeName;
  if (tag === 'INPUT') {
    if (document.activeElement !== a) {
      if (a.type === 'checkbox') a.checked = b.hasAttribute('checked');
      else if (a.value !== (b.getAttribute('value') || '')) a.value = b.getAttribute('value') || '';
    }
    return;
  }
  if (tag === 'SELECT') {
    morphChildren(a, b);
    const chosen = b.querySelector('option[selected]');
    if (chosen && document.activeElement !== a) a.value = chosen.getAttribute('value');
    return;
  }
  morphChildren(a, b);
}

function morphChildren(parent, next) {
  const keyed = new Map();
  for (let c = parent.firstChild; c; c = c.nextSibling) {
    const k = keyOf(c);
    if (k != null) keyed.set(k, c);
  }
  let cur = parent.firstChild;
  let n = next.firstChild;
  while (n) {
    const following = n.nextSibling;
    const k = keyOf(n);
    let match = null;
    if (k != null) {
      match = keyed.get(k) || null;
      if (match) keyed.delete(k);
    } else {
      let c = cur;
      while (c && keyOf(c) != null) c = c.nextSibling;
      if (c && c.nodeType === n.nodeType && c.nodeName === n.nodeName) match = c;
    }
    if (match) {
      if (match === cur) cur = cur.nextSibling;
      else parent.insertBefore(match, cur);
      morphNode(match, n);
    } else {
      parent.insertBefore(n, cur);
    }
    n = following;
  }
  while (cur) {
    const after = cur.nextSibling;
    parent.removeChild(cur);
    cur = after;
  }
}

function morph(el, html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  morphChildren(el, tpl.content);
}

/* FLIP: rows glide to their new place instead of jumping. */
function captureFlip(root) {
  const map = new Map();
  for (const el of $$('[data-flip]', root)) map.set(el, el.getBoundingClientRect().top);
  return map;
}
function playFlip(map) {
  if (!motionOK()) return;
  for (const [el, top] of map) {
    if (!el.isConnected) continue;
    const dy = top - el.getBoundingClientRect().top;
    if (Math.abs(dy) < 1) continue;
    el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], {
      duration: 420,
      easing: 'cubic-bezier(.2,.9,.25,1)',
    });
  }
}

  up: ic('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>'),
  pencil: ic('<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>'),
  trophy: ic('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/>'),
  phone: ic('<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>'),
  clock: ic('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),
  back: ic('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
};

const BRAND = `<svg viewBox="0 0 40 40" class="brand" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#F0663B"/><circle cx="20" cy="24" r="15" fill="#FA9537"/><circle cx="20" cy="24" r="10.5" fill="#FEC447"/><circle cx="20" cy="24" r="6.5" fill="#FFF7CC"/><path d="M0 28c7-5 12-5 20-1s14 3 20-1v14H0z" fill="#1A1130"/></svg>`;

const CHECK_SVG = `<svg viewBox="0 0 32 32" aria-hidden="true"><circle class="c-ring" cx="16" cy="16" r="13"/><circle class="c-fill" cx="16" cy="16" r="13"/><path class="c-mark" pathLength="1" d="M10 16.5l4.2 4.2L22.5 12"/></svg>`;

const colorOf = (cat) => (cat ? cat.color : '#FFC145');
const catMeta = (cat) => (cat ? `<span class="m">${esc(cat.emoji)} ${esc(cat.name)}</span>` : '');

/* ------------------------------------------------------------- Navigation */
const TABS = [
  ['today', 'Heute', I.sun],
  ['goals', 'Ziele', I.target],
  ['rems', 'Erinnerungen', I.bell],
  ['levels', 'Level', I.peak],
];

function navHtml() {
  const item = ([id, label, icon]) =>
    `<button class="nav-item ${ui.tab === id ? 'on' : ''}" data-act="tab" data-tab="${id}" data-fx="tab" aria-current="${ui.tab === id ? 'page' : 'false'}">${icon}<span>${label}</span></button>`;
  return {
    tabbar:
      item(TABS[0]) +
      item(TABS[1]) +
      `<button class="add-sun" data-act="add" data-fx="none" aria-label="Neu anlegen"><span>${I.plus}</span></button>` +
      item(TABS[2]) +
      item(TABS[3]),
    rail:
      `<div class="rail-brand">${BRAND}<span>Tagwerk</span></div>` +
      `<button class="add-sun" data-act="add" data-fx="none" aria-label="Neu anlegen" title="Neu anlegen (N)"><span>${I.plus}</span></button>` +
      `<div class="rail-items">${TABS.map(item).join('')}</div>` +
      `<button class="nav-item rail-settings" data-act="settings">${I.sliders}<span>Einstellungen</span></button>`,
  };
}

/* ------------------------------------------------------------ Sky content */
function sceneTexts() {
  const t = todayStr();
  if (ui.tab === 'today') {
    const rel = relDay(ui.date, t);
    return {
      eyebrow: rel ? `${rel} · ${fmtDay(ui.date)}` : `${fmtDay(ui.date)} ${ui.date.slice(0, 4)}`,
      title: WD_LONG[weekdayOf(ui.date)],
    };
  }
  if (ui.tab === 'goals') return { eyebrow: `KW ${isoWeek(t)} · ${MONTHS[fromYmd(t).getMonth()]}`, title: 'Ziele' };
  if (ui.tab === 'rems') return { eyebrow: 'Nichts vergessen', title: 'Erinnerungen' };
  return { eyebrow: 'Dein Fortschritt', title: 'Level' };
}

function sceneButtons() {
  const t = todayStr();
  let h = '';
  if (ui.tab === 'today' && ui.date !== t) {
    h += `<button class="sky-btn sky-today" data-act="go-today" title="Zu heute springen (T)">Heute</button>`;
  }
  if (ui.tab === 'today') h += `<button class="sky-btn" data-act="open-calendar" aria-label="Datum wählen">${I.calendar}</button>`;
  h += `<button class="sky-btn only-phone" data-act="settings" aria-label="Einstellungen">${I.sliders}</button>`;
  return h;
}

function footHtml() {
  const t = todayStr();
  const d = derived();
  const total = totalLevel(d.xpTotal);
  const levelBlock = `
    <button class="foot-level" data-act="tab" data-tab="levels" aria-label="Zum Level-Tab">
      <span class="foot-level-top"><b>Level ${total.level}</b><span>${rankOf(total.level)}</span></span>
      <span class="bar"><i style="width:${(total.pct * 100).toFixed(1)}%"></i></span>
      <span class="foot-level-sub">${total.into} / ${total.need} XP</span>
    </button>`;
  const lvPill = `<button class="pill only-phone" data-act="tab" data-tab="levels">Lv <b>${total.level}</b></button>`;
  const streak = streakInfo(t);
  const streakPill = streak.n ? `<span class="pill ${streak.doneToday ? 'lit' : ''}" title="${plural(streak.n, 'Tag', 'Tage')} in Folge">${I.flame}<b>${streak.n}</b></span>` : '';

  if (ui.tab === 'today') {
    const st = dayStat(ui.date);
    const future = ui.date > t;
    const xp = d.xpDay[ui.date] || 0;
    const mini = `<span class="foot-mini">${esc(fmtWdShort(ui.date))}</span>`;
    return `
      <div class="foot-left">${mini}
        <span class="foot-count">${future ? `<b>${st.total}</b>` : `<b>${st.done}</b><i>/${st.total}</i>`}</span>
        <span class="foot-label">${future ? 'geplant' : 'erledigt'}</span>
      </div>
      <div class="foot-right">
        ${future && !st.xp ? '' : `<span class="pill xp" id="xpPill">${future ? `<b>${st.xp}</b> XP möglich` : `<b>+${xp}</b> XP`}</span>`}
        ${streakPill}${lvPill}
      </div>${levelBlock}`;
  }
  if (ui.tab === 'goals') {
    const week = goalsFor('week', currentPeriod('week', t));
    const month = goalsFor('month', currentPeriod('month', t));
    const done = (l) => l.filter((g) => g.doneAt).length;
    return `
      <div class="foot-left"><span class="foot-count"><b>${done(week)}</b><i>/${week.length}</i></span><span class="foot-label">diese Woche</span></div>
      <div class="foot-right"><span class="pill"><b>${done(month)}/${month.length}</b> im Monat</span>${lvPill}</div>${levelBlock}`;
  }
  if (ui.tab === 'rems') {
    const upcoming = live('rems')
      .filter((r) => !(r.kind === 'once' && r.doneAt))
      .map((r) => ({ r, occ: nextOf(r, t) }))
      .filter((x) => x.occ >= t)
      .sort((a, b) => (a.occ < b.occ ? -1 : 1))[0];
    return `
      <div class="foot-left foot-next">${
        upcoming
          ? `<span class="foot-label">Als Nächstes, ${countdown(diffDays(upcoming.occ, t))}</span><span class="foot-next-t">${esc(upcoming.r.title)}</span>`
          : `<span class="foot-label">Gerade steht nichts an</span>`
      }</div>
      <div class="foot-right">${lvPill}</div>${levelBlock}`;
  }
  return `
    <div class="foot-left"><span class="foot-count"><b>${total.need - total.into}</b></span><span class="foot-label">XP bis Level ${total.level + 1}</span></div>
    <div class="foot-right">${streakPill}</div>${levelBlock}`;
}

/* ------------------------------------------------------------- Week strip */
function dayCell(date, sel) {
  const t = todayStr();
  const st = dayStat(date);
  const pct = st.total ? (st.done / st.total) * 100 : 0;
  const hasRem = remsForDay(date).some((r) => r.until === 0);
  const ring = st.total
    ? `<svg class="wd-ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="tr" cx="20" cy="20" r="18"/><circle class="pr ${pct ? '' : 'none'}" cx="20" cy="20" r="18" pathLength="100" stroke-dasharray="${pct.toFixed(1)} 100"/></svg>`
    : '';
  const label = `${WD_LONG[weekdayOf(date)]}, ${fmtDay(date)}${st.total ? `, ${st.done} von ${st.total} erledigt` : ''}`;
  return `<button class="wd ${date === sel ? 'sel' : ''} ${date === t ? 'today' : ''} ${st.total && st.done === st.total ? 'full' : ''}" data-act="day" data-date="${date}" aria-label="${esc(label)}">
      <span class="wd-name">${WD_SHORT[weekdayOf(date)]}</span>
      <span class="wd-num">${ring}<b>${fromYmd(date).getDate()}</b></span>
      <span class="wd-dot ${hasRem ? 'on' : ''}"></span>
    </button>`;
}

function weekStrip(date) {
  const mon = weekStart(date);
  const page = (m) => `<div class="wk">${Array.from({ length: 7 }, (_, i) => dayCell(addDays(m, i), date)).join('')}</div>`;
  return `<div class="strip" data-k="strip">
    <button class="wk-arrow" data-act="week" data-dir="-1" aria-label="Vorherige Woche">${I.left}</button>
    <div class="wk-view"><div class="wk-track">${page(addDays(mon, -7))}${page(mon)}${page(addDays(mon, 7))}</div></div>
    <button class="wk-arrow" data-act="week" data-dir="1" aria-label="Nächste Woche">${I.right}</button>
  </div>`;
}

/* ------------------------------------------------------------------ Rows */
function taskRow(task, date, done, opts = {}) {
  const cat = getCat(task.catId);
  const meta = [];
  if (cat) meta.push(catMeta(cat));
  if (opts.overdue) meta.push(`<span class="m late">seit ${esc(fmtDayShort(task.date))}</span>`);
  if (task.repeat) {
    meta.push(`<span class="m">${I.repeat}${esc(repeatLabel(task.repeat))}</span>`);
    const n = routineStreak(task, todayStr() < date ? todayStr() : date);
    if (n >= 2) meta.push(`<span class="m hot">${I.flame}${n}×</span>`);
  }
  const attrs = `data-id="${task.id}" data-date="${date}"`;
  return `<div class="row-wrap" data-k="${task.id}|${date}" data-flip style="--i:${opts.i || 0}">
    <div class="row-under" aria-hidden="true">
      <span class="u u-done">${I.check}Erledigt</span>
      <span class="u u-move">Morgen${I.arrow}</span>
      <span class="u u-del">Löschen${I.trash}</span>
    </div>
    <div class="row ${done ? 'done' : ''}" style="--c:${colorOf(cat)}" data-swipe ${attrs}>
      <button class="chk" data-act="toggle" data-fx="none" ${attrs} aria-pressed="${done}" aria-label="${esc(task.title)} ${done ? 'wieder öffnen' : 'erledigen'}">${CHECK_SVG}</button>
      <button class="row-main" data-act="edit-task" ${attrs}>
        <span class="row-title"><span class="t">${esc(task.title)}</span></span>
        ${meta.length ? `<span class="row-meta">${meta.join('')}</span>` : ''}
      </button>
      <span class="row-tools">
        ${done ? '' : `<button class="tool" data-act="move-tomorrow" ${attrs} title="Auf morgen schieben" aria-label="Auf morgen schieben">${I.arrow}</button>`}
        <button class="tool" data-act="delete-task" data-fx="none" ${attrs} title="Löschen" aria-label="Löschen">${I.trash}</button>
      </span>
      <span class="stamp">+${task.xp}</span>
    </div>
  </div>`;
}

function remWhen(rem, occ, until, late) {
  if (late) return `Überfällig seit ${fmtDayShort(occ)}`;
  const at = rem.time ? ` um ${rem.time}` : '';
  if (until === 0) return `Heute${at}`;
  if (until === 1) return `Morgen${at}`;
  return `In ${until} Tagen, ${fmtWdShort(occ)}${at}`;
}
function ageText(rem, occ) {
  const age = ageAt(rem, occ);
  if (!age || age < 1) return '';
  return /geburtstag/i.test(rem.title) ? ` · wird ${age}` : ` · ${age} Jahre`;
}

function remRow({ rem, occ, until, late }) {
  return `<div class="rem-row ${late ? 'late' : ''}" data-k="r-${rem.id}" data-flip>
    <span class="rem-ic">${rem.kind === 'yearly' ? I.repeat : I.bell}</span>
    <button class="rem-main" data-act="edit-rem" data-id="${rem.id}">
      <span class="rem-title">${esc(rem.title)}</span>
      <span class="rem-sub">${esc(remWhen(rem, occ, until, late))}${esc(ageText(rem, occ))}</span>
    </button>
    <button class="rem-ok" data-act="dismiss-rem" data-fx="none" data-id="${rem.id}" data-occ="${occ}" data-until="${until}" aria-label="${esc(rem.title)} abhaken" title="Abhaken, bringt keine XP">${I.check}</button>
  </div>`;
}

const groupHead = (key, label, extra = '') => `<div class="gh" data-k="${key}"><span>${label}</span>${extra}</div>`;

/* ----------------------------------------------------------------- Heute */
const demoBanner = () =>
  hasDemo()
    ? `<div class="demo-line" data-k="n-demo"><span><b>Beispieldaten</b> zum Ausprobieren</span><button class="demo-x" data-act="remove-demo">Entfernen</button></div>`
    : '';

const installBanner = () =>
  canSuggestInstall()
    ? `<div class="note" data-k="n-install">
        <p><b>Leg Tagwerk auf deinen Home-Bildschirm.</b> Dann öffnet es sich wie eine echte App, mit eigenem Icon und ohne Browserleiste.</p>
        <div class="note-btns"><button class="btn small" data-act="install">Zeig mir wie</button><button class="btn small ghost" data-act="dismiss-install">Später</button></div>
      </div>`
    : '';

function viewToday() {
  const date = ui.date;
  const t = todayStr();
  const isToday = date === t;
  const items = dayTasks(date);
  const open = items.filter((x) => !x.done);
  const done = items.filter((x) => x.done);
  const over = isToday ? overdueTasks(t) : [];
  const rems = remsForDay(date);
  const label = relDay(date, t) || WD_LONG[weekdayOf(date)];
  const parts = [];
  let i = 0;

  if (rems.length) {
    parts.push(groupHead('h-rem', 'Denk dran'));
    rems.forEach((r) => parts.push(remRow(r)));
  }
  if (over.length) {
    parts.push(groupHead('h-over', 'Überfällig'));
    over.forEach((task) => parts.push(taskRow(task, task.date, false, { overdue: true, i: i++ })));
  }
  parts.push(
    groupHead('h-tasks', 'Aufgaben', `<button class="gh-btn" data-act="add" data-pane="tpl">${I.layers}Vorlagen</button>`),
  );
  if (!items.length && !over.length) {
    parts.push(`<div class="empty" data-k="empty">
      <p class="empty-t">${date < t ? 'An diesem Tag war nichts geplant.' : `Für ${esc(label === 'Heute' ? 'heute' : label === 'Morgen' ? 'morgen' : label === 'Übermorgen' ? 'übermorgen' : label)} ist noch nichts geplant.`}</p>
      <p>Leg eine Aufgabe an oder nimm eine aus deinen Vorlagen. Jede erledigte Aufgabe hebt die Sonne ein Stück höher.</p>
    </div>`);
  }
  open.forEach(({ task }) => parts.push(taskRow(task, date, false, { i: i++ })));
  parts.push(
    `<button class="add-row" data-k="add-row" data-act="add" data-flip>${I.plus}Aufgabe für ${esc(label === 'Heute' || label === 'Morgen' || label === 'Übermorgen' ? label.toLowerCase() : label)}</button>`,
  );
  if (items.length && !open.length && !over.length) {
    parts.push(`<div class="perfect" data-k="perfect">
      <p class="perfect-t">Tagwerk vollbracht.</p>
      <p>Alles erledigt, die Sonne steht ganz oben. +${dayStat(date).xpDone} XP an diesem Tag.</p>
    </div>`);
  }
  if (done.length) {
    parts.push(groupHead('h-done', `Erledigt · ${done.length}`));
    done.forEach(({ task }) => parts.push(taskRow(task, date, true)));
  }

  const dirClass = ui.dayDir > 0 ? 'turn-next' : ui.dayDir < 0 ? 'turn-prev' : '';
  return `<div class="page has-aside" data-k="today">
    <div class="col-main">
      ${weekStrip(date)}
      ${demoBanner()}
      <div class="list ${dirClass}" data-k="day-${date}">${parts.join('')}</div>
      ${installBanner()}
    </div>
    ${asideToday()}
  </div>`;
}

/* The extra column on large screens: everything else at a glance. */
function asideToday() {
  const t = todayStr();
  const week = goalsFor('week', currentPeriod('week', t));
  const up = live('rems')
    .filter((r) => !(r.kind === 'once' && r.doneAt))
    .map((rem) => ({ rem, occ: nextOf(rem, t) }))
    .filter((x) => x.occ >= t)
    .sort((a, b) => (a.occ < b.occ ? -1 : 1))
    .slice(0, 4);
  const d = derived();
  return `<aside class="aside" data-k="aside">
    <section>
      <button class="aside-h" data-act="tab" data-tab="goals">Wochenziele ${I.right}</button>
      ${week.length ? week.map((g) => `
        <button class="aside-goal ${g.doneAt ? 'done' : ''}" data-act="edit-goal" data-id="${g.id}">
          <span class="dot" style="background:${colorOf(getCat(g.catId))}"></span><span class="at">${esc(g.title)}</span><span class="ax">+${g.xp}</span>
        </button>`).join('') : '<p class="aside-empty">Für diese Woche ist noch kein Ziel gesetzt.</p>'}
    </section>
    <section>
      <button class="aside-h" data-act="tab" data-tab="rems">Bald ${I.right}</button>
      ${up.length ? up.map(({ rem, occ }) => `
        <button class="aside-rem" data-act="edit-rem" data-id="${rem.id}">
          <span class="at">${esc(rem.title)}</span><span class="ax">${esc(countdown(diffDays(occ, t)))}</span>
        </button>`).join('') : '<p class="aside-empty">Keine Erinnerungen in Sicht.</p>'}
    </section>
    <section>
      <button class="aside-h" data-act="tab" data-tab="levels">Kategorien ${I.right}</button>
      ${sortedCats().map((c) => {
        const l = catLevel(d.xpCat[c.id] || 0);
        return `<div class="aside-cat" style="--c:${c.color}"><span class="ac-top"><span>${esc(c.emoji)} ${esc(c.name)}</span><b>Lv ${l.level}</b></span><span class="bar"><i style="width:${(l.pct * 100).toFixed(1)}%"></i></span></div>`;
      }).join('')}
    </section>
  </aside>`;
}

/* ----------------------------------------------------------------- Ziele */
function goalDeadline(g) {
  const t = todayStr();
  if (g.doneAt) return `Geschafft am ${fmtDayShort(g.doneOn)}`;
  if (g.kind === 'big') {
    if (!g.target) return '';
    const n = diffDays(g.target, t);
    return n >= 0 ? `Bis ${fmtDayShort(g.target)} ${g.target.slice(0, 4)}, noch ${plural(n, 'Tag', 'Tage')}` : `Ziel war ${fmtDayShort(g.target)} ${g.target.slice(0, 4)}`;
  }
  if (g.kind === 'week') {
    const end = addDays(g.period, 6);
    const n = diffDays(end, t);
    if (n >= 0 && n <= 6) return n === 0 ? 'Letzter Tag' : `Noch ${plural(n, 'Tag', 'Tage')}`;
    return '';
  }
  if (g.period === monthOf(t)) {
    const [y, m] = g.period.split('-').map(Number);
    const n = daysInMonth(y, m) - fromYmd(t).getDate();
    return n === 0 ? 'Letzter Tag' : `Noch ${plural(n, 'Tag', 'Tage')}`;
  }
  return '';
}

function goalCard(g, opts = {}) {
  const cat = getCat(g.catId);
  const steps = g.steps || [];
  const doneSteps = steps.filter((s) => s.done).length;
  const deadline = goalDeadline(g);
  return `<article class="goal ${g.doneAt ? 'is-done' : ''}" data-k="g-${g.id}" data-flip style="--c:${colorOf(cat)}">
    <div class="goal-top">
      <button class="goal-main" data-act="edit-goal" data-id="${g.id}">
        <span class="goal-title">${esc(g.title)}</span>
        <span class="row-meta">${catMeta(cat)}${deadline ? `<span class="m">${esc(deadline)}</span>` : ''}${opts.stale ? `<span class="m late">${g.kind === 'week' ? `aus KW ${isoWeek(g.period)}` : `aus ${esc(fmtMonth(g.period))}`}</span>` : ''}</span>
      </button>
      ${g.doneAt
        ? `<span class="goal-won">${I.trophy}<b>+${g.xp}</b></span>`
        : `<button class="hold ${steps.length && doneSteps === steps.length ? 'ready' : ''}" data-hold="${g.id}" data-fx="none" aria-label="${esc(g.title)} abschließen, ${g.xp} XP. Gedrückt halten.">
            <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="h-track" cx="32" cy="32" r="29"/><circle class="h-fill" cx="32" cy="32" r="29" pathLength="100"/></svg>
            <span class="hold-core"><b>+${g.xp}</b><small>halten</small></span>
          </button>`}
    </div>
    ${steps.length && !g.doneAt ? `
      <div class="goal-progress"><span class="bar"><i style="width:${((doneSteps / steps.length) * 100).toFixed(1)}%"></i></span><span class="gp-n">${doneSteps}/${steps.length}</span></div>
      <div class="steps">${steps.map((s, i) => `
        <button class="step ${s.done ? 'on' : ''}" data-k="${s.id}" data-act="toggle-step" data-fx="none" data-goal="${g.id}" data-step="${s.id}" data-i="${i}" aria-pressed="${!!s.done}">
          <span class="step-box">${I.check}</span><span>${esc(s.t)}</span>
        </button>`).join('')}
      </div>` : ''}
    ${opts.stale ? `<div class="goal-carry"><button class="btn small" data-act="carry-goal" data-id="${g.id}">In diese ${g.kind === 'week' ? 'Woche' : 'Zeit'} übernehmen</button></div>` : ''}
  </article>`;
}

function segmented(act, options, value, extraAttr = '') {
  const idx = Math.max(0, options.findIndex(([v]) => v === value));
  return `<div class="seg" style="--n:${options.length};--i:${idx}" role="group">
    <span class="seg-ind" aria-hidden="true"></span>
    ${options.map(([v, label]) => `<button class="${v === value ? 'on' : ''}" data-act="${act}" data-val="${esc(v)}" ${extraAttr} aria-pressed="${v === value}">${label}</button>`).join('')}
  </div>`;
}

function viewGoals() {
  const k = ui.goalKind;
  const t = todayStr();
  const period = k === 'week' ? ui.goalWeek : k === 'month' ? ui.goalMonth : null;
  const list = goalsFor(k, period);
  const open = list.filter((g) => !g.doneAt);
  const done = list.filter((g) => g.doneAt);
  const isCurrent = period === currentPeriod(k, t);
  const stale = isCurrent ? staleGoals(k, period) : [];
  let nav = '';
  if (k === 'week') {
    const rel = isCurrent ? 'Diese Woche' : period === addDays(currentPeriod('week', t), 7) ? 'Nächste Woche' : period === addDays(currentPeriod('week', t), -7) ? 'Letzte Woche' : `KW ${isoWeek(period)}`;
    nav = periodNav(rel, fmtWeekRange(period));
  } else if (k === 'month') {
    const rel = isCurrent ? 'Dieser Monat' : period === addMonths(currentPeriod('month', t), 1) ? 'Nächster Monat' : fmtMonth(period);
    nav = periodNav(rel, isCurrent || period === addMonths(currentPeriod('month', t), 1) ? fmtMonth(period) : '');
  }
  const parts = [];
  if (stale.length) {
    parts.push(groupHead('h-stale', 'Noch offen von früher'));
    stale.forEach((g) => parts.push(goalCard(g, { stale: true })));
    parts.push(groupHead('h-now', k === 'week' ? 'Diese Woche' : 'Dieser Monat'));
  }
  if (!list.length) {
    const hint = { week: 'Was soll bis Sonntag stehen?', month: 'Was willst du diesen Monat schaffen?', big: 'Was ist das eine Große, auf das du hinarbeitest?' }[k];
    parts.push(`<div class="empty" data-k="empty"><p class="empty-t">${hint}</p><p>Ziele bringen deutlich mehr XP als einzelne Aufgaben. Zum Abschließen hältst du den Knopf gedrückt.</p></div>`);
  }
  open.forEach((g) => parts.push(goalCard(g)));
  parts.push(`<button class="add-row" data-k="add-goal" data-act="add" data-pane="goal" data-flip>${I.plus}${{ week: 'Wochenziel', month: 'Monatsziel', big: 'Großes Ziel' }[k]} hinzufügen</button>`);
  if (done.length) {
    parts.push(groupHead('h-done', `Geschafft · ${done.length}`));
    done.forEach((g) => parts.push(goalCard(g)));
  }
  return `<div class="page" data-k="goals">
    ${segmented('goal-kind', [['week', 'Woche'], ['month', 'Monat'], ['big', 'Groß']], k)}
    ${nav}
    <div class="list" data-k="goals-${k}-${period}">${parts.join('')}</div>
  </div>`;
}

const periodNav = (title, sub) => `<div class="period">
  <button class="icon-btn" data-act="goal-period" data-dir="-1" aria-label="Zurück">${I.left}</button>
  <div class="period-t"><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div>
  <button class="icon-btn" data-act="goal-period" data-dir="1" aria-label="Weiter">${I.right}</button>
</div>`;

/* ---------------------------------------------------------- Erinnerungen */
function remTile(rem, occ, opts = {}) {
  const t = todayStr();
  const d = fromYmd(occ);
  const n = diffDays(occ, t);
  const when = opts.history ? `Erledigt` : n < 0 ? `Überfällig seit ${fmtDayShort(occ)}` : countdown(n);
  const sub = `${when.charAt(0).toUpperCase()}${when.slice(1)}${rem.time ? ` · ${rem.time}` : ''}${esc(ageText(rem, occ))}`;
  const soon = n >= 0 && n <= 7 && !opts.history;
  return `<div class="rem-card ${soon ? 'soon' : ''} ${n < 0 && !opts.history ? 'late' : ''} ${opts.history ? 'history' : ''}" data-k="rc-${rem.id}" data-flip>
    <button class="rem-card-main" data-act="edit-rem" data-id="${rem.id}">
      <span class="date-tile"><b>${d.getDate()}</b><small>${MONTHS_SHORT[d.getMonth()]}</small></span>
      <span class="rem-card-txt"><span class="rem-title">${esc(rem.title)}</span><span class="rem-sub">${sub}</span></span>
    </button>
    ${rem.kind === 'once' && !opts.history ? `<button class="rem-ok" data-act="dismiss-rem" data-fx="none" data-id="${rem.id}" data-occ="${occ}" data-until="0" aria-label="${esc(rem.title)} abhaken" title="Abhaken, bringt keine XP">${I.check}</button>` : ''}
    ${opts.history ? `<button class="rem-ok" data-act="reopen-rem" data-id="${rem.id}" aria-label="Wieder öffnen" title="Wieder öffnen">${I.repeat}</button>` : ''}
  </div>`;
}

function viewRems() {
  const t = todayStr();
  const once = live('rems').filter((r) => r.kind === 'once');
  const active = once.filter((r) => !r.doneAt).sort((a, b) => (a.date < b.date ? -1 : 1));
  const finished = once.filter((r) => r.doneAt).sort((a, b) => b.doneAt - a.doneAt).slice(0, 8);
  const yearly = live('rems')
    .filter((r) => r.kind === 'yearly')
    .map((rem) => ({ rem, occ: nextYearly(rem, t) }))
    .sort((a, b) => (a.occ < b.occ ? -1 : 1));
  const parts = [];
  parts.push(groupHead('h-once', 'Normal', `<button class="gh-btn" data-act="add" data-pane="rem" data-remkind="once">${I.plus}Neu</button>`));
  if (!active.length) {
    parts.push(`<div class="empty small" data-k="e-once"><p>Für kleine Dinge und einmalige Events: „Pfand mitnehmen“, „Konzert am Samstag“.</p></div>`);
  }
  active.forEach((rem) => parts.push(remTile(rem, rem.date)));
  parts.push(groupHead('h-yearly', 'Jährlich', `<button class="gh-btn" data-act="add" data-pane="rem" data-remkind="yearly">${I.plus}Neu</button>`));
  if (!yearly.length) {
    parts.push(`<div class="empty small" data-k="e-yearly"><p>Für Geburtstage und Jahrestage. Sie kommen von selbst jedes Jahr wieder.</p></div>`);
  }
  yearly.forEach(({ rem, occ }) => parts.push(remTile(rem, occ)));
  if (finished.length) {
    parts.push(groupHead('h-fin', 'Zuletzt erledigt'));
    finished.forEach((rem) => parts.push(remTile(rem, rem.date, { history: true })));
  }
  return `<div class="page" data-k="rems"><div class="list" data-k="rem-list">${parts.join('')}</div>
    <p class="fineprint">Erinnerungen bringen keine XP. Du siehst sie in der Tagesansicht, sobald sie anstehen.</p>
  </div>`;
}

/* ----------------------------------------------------------------- Level */
function heatmap() {
  const t = todayStr();
  const weeks = 17;
  const first = addDays(weekStart(t), -(weeks - 1) * 7);
  const xp = derived().xpDay;
  const LEVELS = [1, 30, 75, 150];
  const step = (v) => {
    if (!v) return 0;
    let s = 1;
    for (let i = 1; i < LEVELS.length; i++) if (v >= LEVELS[i]) s = i + 1;
    return s;
  };
  let cols = '';
  let monthRow = '';
  let lastMonth = -1;
  for (let w = 0; w < weeks; w++) {
    const mon = addDays(first, w * 7);
    const m = fromYmd(mon).getMonth();
    monthRow += `<span>${m !== lastMonth && w < weeks - 1 ? MONTHS_SHORT[m] : ''}</span>`;
    lastMonth = m;
    let col = '';
    for (let d = 0; d < 7; d++) {
      const date = addDays(mon, d);
      if (date > t) {
        col += '<span class="hm-cell future"></span>';
        continue;
      }
      const v = xp[date] || 0;
      const label = `${fmtWdShort(date)}: ${v} XP`;
      col += `<button class="hm-cell s${step(v)} ${date === t ? 'now' : ''}" data-act="heat" data-fx="none" data-tip="${esc(label)}" title="${esc(label)}" aria-label="${esc(label)}"></button>`;
    }
    cols += `<div class="hm-col">${col}</div>`;
  }
  return `<section class="hm" aria-label="XP pro Tag, letzte ${weeks} Wochen">
    <div class="hm-grid" style="--weeks:${weeks}">
      <div class="hm-months">${monthRow}</div>
      <div class="hm-days"><span>Mo</span><span></span><span>Mi</span><span></span><span>Fr</span><span></span><span></span></div>
      <div class="hm-cols">${cols}</div>
    </div>
    <div class="hm-foot">
      <span class="hm-tip" id="heatTip">${esc(ui.heatTip || 'Tippe auf einen Tag für die XP')}</span>
      <span class="hm-legend"><span>weniger</span><i class="hm-cell s0"></i><i class="hm-cell s1"></i><i class="hm-cell s2"></i><i class="hm-cell s3"></i><i class="hm-cell s4"></i><span>mehr</span></span>
    </div>
  </section>`;
}

function catCard(c) {
  const d = derived();
  const xp = d.xpCat[c.id] || 0;
  const l = catLevel(xp);
  return `<button class="cat-card" data-k="c-${c.id}" data-act="edit-cat" data-id="${c.id}" style="--c:${c.color}">
    <span class="cat-disc" aria-hidden="true">${esc(c.emoji)}</span>

      <span class="bar lg"><i style="width:${(l.pct * 100).toFixed(1)}%"></i></span>
      <span class="cat-sub"><span>${l.into} / ${l.need} XP</span><span>${plural(d.countCat[c.id] || 0, 'Eintrag', 'Einträge')}</span></span>
    </span>

}

function viewLevels() {
  const d = derived();

  const cats = sortedCats().sort((a, b) => (d.xpCat[b.id] || 0) - (d.xpCat[a.id] || 0));

    <section class="overall">
      <div class="overall-top">
        <div class="overall-n"><small>Gesamt-Level</small><b>${total.level}</b></div>
        <div class="overall-r"><span class="overall-rank">${rankOf(total.level)}</span><span class="overall-sub">${total.into} / ${total.need} XP</span></div>
      </div>
      <span class="bar lg sun"><i style="width:${(total.pct * 100).toFixed(1)}%"></i></span>
      <dl class="stats">
        <div><dt>Gesamt</dt><dd>${d.xpTotal}<small> XP</small></dd></div>
        <div><dt>Serie</dt><dd>${s.n}<small> ${s.n === 1 ? 'Tag' : 'Tage'}</small></dd></div>
        <div><dt>Perfekte Tage</dt><dd>${perfectDays()}</dd></div>
        <div><dt>Erledigt</dt><dd>${d.taskCount + d.goalCount}</dd></div>
      </dl>
    </section>
    ${groupHead('h-heat', 'Deine letzten Wochen')}
    ${heatmap()}
    ${groupHead('h-cats', 'Kategorien', `<button class="gh-btn" data-act="new-cat">${I.plus}Neu</button>`)}
    <div class="cat-list" data-k="cat-list">
      ${cats.map(catCard).join('') || `<div class="empty small" data-k="e-cats"><p>Lege Kategorien an wie „Schule“ oder „Sport“. In jeder levelst du getrennt auf.</p></div>`}
    </div>
  </div>`;
}
