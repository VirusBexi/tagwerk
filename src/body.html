<div id="app" class="app">
  <nav id="rail" class="rail" aria-label="Hauptnavigation"></nav>
  <header id="scene" class="scene">
    <div class="sky-wrap" aria-hidden="true">
      <svg class="sky layer" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="stars layer"></div>
      <svg class="clouds layer" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg class="hills layer" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="grain layer"></div>
    </div>
    <div class="scene-top">
      <p id="eyebrow" class="eyebrow"></p>
      <div id="sceneBtns" class="scene-btns"></div>
    </div>
    <h1 id="title" class="title"></h1>
    <div id="sceneFoot" class="scene-foot"></div>
  </header>
  <main id="view" class="view"></main>
  <nav id="tabbar" class="tabbar" aria-label="Hauptnavigation"></nav>
</div>
<div id="hud" class="hud" aria-live="polite"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="badgeRoot" class="bdg-root" aria-live="polite"></div>
<div id="sheetRoot"></div>
<div id="dialogRoot"></div>
<div id="levelRoot"></div>
<canvas id="fx" class="fx" aria-hidden="true"></canvas>
